# musafircars.com
#
# Install as /etc/nginx/sites-available/musafircars.com and symlink into
# sites-enabled. HTTP only as written: certbot adds the TLS server block and
# the 80 -> 443 redirect itself when the certificate is issued. Do not
# hand-write ssl_certificate paths before the cert exists, an nginx that
# cannot find a certificate refuses to start, and on this box that means all
# seventeen sites go down, not just this one.
#
# www is NOT redirected here. The Next application does it (see
# next.config.ts), so this file stays a dumb proxy to one port and never needs
# editing again.
#
# The only upstream is 127.0.0.1. That is a hard rule on this box: certbot
# fully stops and restarts nginx twice a day, which re-parses every vhost, and
# an upstream hostname that stops resolving turns a routine renewal into a
# total outage. It has happened twice, for about 30 hours each time.

server {
    listen 80;
    listen [::]:80;
    server_name musafircars.com www.musafircars.com;

    # Photographs of cars, and the occasional PDF.
    client_max_body_size 12m;

    # Next streams responses; buffering them adds latency and nothing else.
    proxy_http_version 1.1;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The backend rate-limits public booking requests by address, and it
        # sits behind this proxy AND behind the Next app. Without a forwarded
        # address every request from the website looks like one visitor, and a
        # busy afternoon starts refusing genuine bookings.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Next reads this to know the canonical scheme. Without it the www
        # redirect in next.config.ts would send people to http.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# The API is deliberately absent from this file.
#
# Nothing in the browser talks to it: every call goes through the Next app's
# own /api/* route handlers, server to server over loopback. So the backend
# needs no hostname, no certificate and no CORS, and nothing outside the box
# can reach it at all. Adding a vhost for it would give away that property for
# no gain.
