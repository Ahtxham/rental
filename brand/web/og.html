<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The link preview, rentals-web/public/og.png, 1200 x 630.

  Rendered rather than drawn, from this page, with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot="$PWD/og.png" "file://$PWD/og.html"

  Everything sits in the middle 630 pixels on purpose: WhatsApp often shows a
  link as a square thumbnail cropped from the centre, and the headline has to
  survive that.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,0,0&family=Public+Sans:wght@400..700&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; background: #0f1f3d;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-family: "Public Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(60% 70% at 50% 40%, rgba(255,255,255,.06) 0, transparent 70%);
  }
  img { width: 540px; height: auto; display: block; }
  h1 {
    margin: 48px 0 0; color: #fff; max-width: 560px;
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-variation-settings: "opsz" 72, "SOFT" 0, "WONK" 0;
    font-size: 56px; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;
  }
  p { margin: 26px 0 0; color: rgba(255,255,255,.72); font-size: 24px; font-weight: 450; }
  p b { color: #ff8a1f; font-weight: 700; }
</style>
</head>
<body>
  <img src="../logo/route-m/lockup-dark.svg" alt="Musafir Cars">
  <h1>Rent a car for the days you need it.</h1>
  <p>By the day in Lahore · <b>musafircars.com</b></p>
</body>
</html>
